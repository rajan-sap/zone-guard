version: "3.9"

services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./weights:/app/weights
      - snapshots:/app/snapshots
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./safety_first.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  snapshots:
